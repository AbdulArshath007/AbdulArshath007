name: Generate Snake

on:
  schedule:
    - cron: "*/5 * * * *"   # updates every 5 minutes
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: AbdulArshath007
          outputs: |
            snake-dark.svg?palette=github-dark&color_snake=%23AA336A&color_dots=%232b1934,%234a2a5c,%236f3f86,%239a5fb8,%23CF9FFF
            snake-light.svg?color_snake=%23AA336A&color_dots=%23f3e8ff,%23e2c9fa,%23d1a9f7,%23c08af4,%23CF9FFF

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: .
          force_orphan: false
          keep_files: false
