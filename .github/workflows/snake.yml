name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"   # updates every 6 hours
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: AbdulArshath007
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%23AA336A&color_dots=#2b1934,#4a2a5c,#6f3f86,#9a5fb8,#CF9FFF
            dist/snake-light.svg?color_snake=%23AA336A&color_dots=#f3e8ff,#e2c9fa,#d1a9f7,#c08af4,#CF9FFF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
